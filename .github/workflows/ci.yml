name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Check dependency advisories
        run: npm audit --audit-level=high
      - name: Typecheck and test
        run: npm run test:all
      - name: Build skill archive and checksum
        run: npm run package
      - name: Verify isolated installation
        run: npm run test:install
      - name: Verify archive checksum
        working-directory: dist
        run: sha256sum --check mistake-workbook.zip.sha256
      - name: Keep verified distribution
        if: matrix.node == '24'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mistake-workbook
          path: |
            dist/mistake-workbook.zip
            dist/mistake-workbook.zip.sha256
          if-no-files-found: error
          retention-days: 14
